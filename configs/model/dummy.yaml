# Dummy model configuration for testing the training pipeline
# This demonstrates how to structure a model config file.

name: dummy
class_path: src.models.dummy_model.DummyModel
description: "Dummy model for pipeline testing"
application: springback_prediction

# Model architecture
architecture:
  input_dim: 10
  hidden_dims: [128, 64, 32]
  output_dim: 3
  activation: relu  # relu, tanh, gelu, leaky_relu, silu
  dropout: 0.1
  batch_norm: true

# Optimizer configuration (includes learning rate and regularization)
optimizer:
  name: adam  # adam, adamw, sgd
  learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]  # For adam/adamw
  momentum: 0.9  # For sgd

# Learning rate scheduler (optional)
scheduler:
  enabled: false
  name: reduce_on_plateau  # reduce_on_plateau, cosine, step
  factor: 0.5
  patience: 10
  min_lr: 0.00001

# Metrics to track (subset of available metrics)
# Available: mse, rmse, mae, r2, mape, epe3d, acc3d_strict, chamfer3d, hausdorff, max_error3d
metrics:
  - mse
  - rmse
  - mae
