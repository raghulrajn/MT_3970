[project]
name = "master-thesis-template"
version = "0.1.0"
description = "Master Thesis Template for Surrogate Model Development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "pytorch-lightning>=2.0.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "omegaconf>=2.3.0",
    "pre-commit>=4.5.0",
    "point-cloud-utils>=0.34.0",
    "torch_geometric>=2.4.0",
    "mlflow>=3.8.1",
    "scienceplots>=2.2.0",
    "ddacs>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "ruff>=0.1.0",
    "pre-commit>=3.5.0",
]

logging = [
    "tensorboard>=2.14.0",
    "mlflow>=2.0.0",
]

docs = [
    "sphinx>=7.0.0",
    "myst-nb>=1.1.0",
    "sphinx-autodoc-typehints>=2.0.0",
    "furo>=2024.0.0",
    "sphinx-autobuild>=2024.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
